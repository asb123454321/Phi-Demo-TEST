<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Phigros 模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s;
        }
        
        #loading-progress {
            width: 80%;
            max-width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        #loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff3366, #ff9966);
            width: 0%;
            transition: width 0.3s;
        }
        
        #loading-text {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }
        
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900;
            text-align: center;
        }
        
        #start-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff3366, #ff9966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 51, 102, 0.3);
        }
        
        #start-button {
            margin-top: 40px;
            padding: 16px 32px;
            font-size: 20px;
            background: linear-gradient(45deg, #ff3366, #ff9966);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(255, 51, 102, 0.4);
        }
        
        #start-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(255, 51, 102, 0.2);
        }
        
        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }
        
        #debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
            display: none;
        }
        
        #offset-toggle {
            position: fixed;
            right: 10px;
            bottom: 10px;
            z-index: 950;
            padding: 8px 14px;
            font-family: inherit;
            font-size: 14px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
        }
        
        #offset-panel {
            position: fixed;
            right: 10px;
            bottom: 58px;
            z-index: 950;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            background: rgba(20, 20, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            
            /* 高度上限：扣掉下方「偏移」按钮(58px)和上下留白(70px)，剩下的全部可用 */
            max-height: calc(100vh - 58px - 70px);
            max-height: calc(100dvh - 58px - 70px);   /* 支持 dvh 的浏览器用更准的值 */
            
            /* 内容超出时内部滚动，不再被屏幕裁掉 */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;   /* iOS 惯性滚动 */
            overscroll-behavior: contain;        /* 滚到头不带动页面 */
            
            /* 允许竖向滑动（滚动），但不要触发双指缩放等默认手势 */
            touch-action: pan-y;
            
            /* 细滚动条（桌面端调试时能看到） */
            scrollbar-width: thin;
        }
        
        #offset-value,
        #font-value {
            padding: 2px 0;
            text-align: center;
            color: #ffcc66;
        }
        
        /* 顶部标题条：唯一可拖动区域（拖动时它不会滚动内容） */
        #offset-value {
            cursor: move;
            touch-action: none;
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 4px 0 8px;
            background: rgba(20, 20, 26, 0.98);   /* 盖住滚上来的内容 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .offset-row {
            display: flex;
            gap: 6px;
        }
        
        .offset-row button,
        #offset-reset {
            flex: 1;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 13px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        
        #offset-toggle:active,
        .offset-row button:active,
        #offset-reset:active {
            background: rgba(255, 90, 130, 0.55);
        }
        
        .offset-row button.font-active {
            background: rgba(255, 204, 102, 0.35);
            border-color: #ffcc66;
        }
        
        #export-hint {
            padding: 2px 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
        }
        
        #export-status {
            min-height: 16px;
            text-align: center;
            font-size: 12px;
            color: #8fe3a0;
        }
        
        /* 表单控件默认不继承字体，补一下让按钮跟随界面字体 */
        button {
            font-family: inherit;
        }
        
        #chart-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        
        #chart-actions button {
            padding: 10px 18px;
            font-family: inherit;
            font-size: 15px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
        }
        
        #chart-actions button:active {
            background: rgba(255, 90, 130, 0.5);
        }
        
        #chart-status {
            margin-top: 16px;
            font-size: 14px;
            color: #ffcc66;
        }
        
        #import-message {
            margin-top: 8px;
            min-height: 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .hidden {
            display: none !important;
        }
        /* ---- 伪全屏（浏览器不支持原生全屏时使用）---- */
        html.fake-fullscreen,
        body.fake-fullscreen {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            overflow: hidden !important;
            background: #000 !important;
        }

        html.fake-fullscreen canvas#main-canvas,
        body.fake-fullscreen canvas#main-canvas {
            width: 100vw !important;
            height: 100vh !important;
            display: block !important;
        }

        /* 伪全屏时把界面上的滚动条藏掉，观感更接近真全屏 */
        html.fake-fullscreen::-webkit-scrollbar,
        body.fake-fullscreen::-webkit-scrollbar {
            display: none;
        }
        /* ---- 面板内的进度条 ---- */
        #seek-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 2px 0 4px;
        }

        #seek-label {
            font-size: 12px;
            color: #ffd700;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        #seek-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.22);
            outline: none;
            cursor: pointer;
        }

        #seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #ff5566;
            cursor: pointer;
        }

        #seek-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #ff5566;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <script>
        // ===== 早期错误探针（必须是第一个脚本）=====
        // 任何脚本错误都直接显示到加载页上，避免再出现「卡住但完全没有提示」
        window.__main_loaded = false;

        const show_probe = (text) => {
            const el = document.querySelector("#loading-text");

            if (el) {
                el.style.color = "#ff5566";
                el.textContent = text;
            }

            // 加载页已隐藏时也能看到（写到开始界面的提示行），并且进控制台
            const msg = document.querySelector("#import-message");

            if (msg) {
                msg.style.color = "#ff5566";
                msg.textContent = text;
            }

            console.error("[探针] " + text);
        };

        window.addEventListener("error", e => {
            if (e.message || e.filename) {
                show_probe("脚本错误：" + (e.message || e.filename) + (e.lineno ? "（第 " + e.lineno + " 行）" : ""));
            }
        });

        window.addEventListener("unhandledrejection", e => {
            const r = e.reason;
            show_probe("未处理的错误：" + (r && r.message ? r.message : String(r)));
        });

        // main.js 若 5 秒后还没开始执行，多半是解析失败 / js 目录没部署
        setTimeout(() => {
            if (!window.__main_loaded) {
                show_probe("main.js 没有开始执行（语法错误，或文件 / js 目录没加载到）");
            }
        }, 5000);
    </script>

    <script>
    // ============================================================
    // 自动横屏 + 全屏
    //   只在 index.html 里实现，不改 main.js。
    //   浏览器要求全屏必须由用户手势触发，所以：
    //     - 按钮点击 → 直接进入全屏 + 锁横屏
    //     - 页面加载 → 只更新按钮文案（无法自动全屏）
    // ============================================================
    (function () {
        "use strict";

        var KEY = "phigros_screen_mode";
        var btn = null;
        var fake_on = false;   // 伪全屏状态（环境不支持原生全屏时使用）

        function is_fullscreen() {
            if (fake_on) return true;

            return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
        }

        function is_landscape() {
            if (screen.orientation && typeof screen.orientation.type === "string") {
                return screen.orientation.type.indexOf("landscape") === 0;
            }

            return window.innerWidth > window.innerHeight;
        }

        function update_label() {
            if (!btn) btn = document.querySelector("#screen-mode-toggle");
            if (!btn) return;

            var on = is_fullscreen();

            btn.textContent = "全屏横屏：" + (on ? "开" : "关");
        }

        function lock_landscape() {
            var so = screen.orientation;

            if (!so || typeof so.lock !== "function") return Promise.resolve(false);

            return so.lock("landscape").then(function () {
                return true;
            }).catch(function (e) {
                // 桌面浏览器 / iOS Safari 通常不支持锁定，忽略即可
                console.warn("[横屏] 锁定失败（不影响全屏）：", e && e.name);
                return false;
            });
        }

        function enter() {
            var el = document.documentElement;
            var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;

            console.log("[全屏] 调用全屏，req =", typeof req);

            if (!req) {
                console.warn("[全屏] 当前浏览器不支持全屏 API，改用伪全屏");
                fake_fullscreen(true);
                return;
            }

            var result;

            try {
                result = req.call(el, { navigationUI: "hide" });
            } catch (e) {
                console.error("[全屏] 调用抛异常：", e && e.name, e && e.message, "→ 改用伪全屏");
                fake_fullscreen(true);
                return;
            }

            if (result && typeof result.then === "function") {
                result.then(function () {
                    console.log("[全屏] 进入成功，fullscreenElement =", document.fullscreenElement && document.fullscreenElement.tagName);
                    fake_fullscreen(false);
                    return lock_landscape();
                }).catch(function (e) {
                    console.error("[全屏] 进入失败：", e && e.name, e && e.message, "→ 改用伪全屏");
                    fake_fullscreen(true);
                });
            } else {
                lock_landscape();
            }
        }

        // ---------- 伪全屏：环境不支持全屏 API 时的降级 ----------
        //   把页面铺满视口、滚到顶部、并尝试锁横屏。
        //   不能真正隐藏浏览器 UI，但至少能把画面铺满。
        function fake_fullscreen(on) {
            if (on === fake_on) return;

            fake_on = on;

            var html = document.documentElement;
            var body = document.body;

            if (on) {
                html.classList.add("fake-fullscreen");
                if (body) body.classList.add("fake-fullscreen");

                window.scrollTo(0, 0);
                lock_landscape();
                console.log("[全屏] 已进入伪全屏（浏览器不支持原生全屏）");
            } else {
                html.classList.remove("fake-fullscreen");
                if (body) body.classList.remove("fake-fullscreen");
            }

            // 画布尺寸变了，触发一次 resize 让主循环重新计算
            window.dispatchEvent(new Event("resize"));
            update_label();
        }

        function exit() {
            if (fake_on) {
                fake_fullscreen(false);
                return;
            }

            var fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;

            if (fn) {
                var r = fn.call(document);

                if (r && typeof r.catch === "function") r.catch(function () {});
            }

            if (screen.orientation && typeof screen.orientation.unlock === "function") {
                try { screen.orientation.unlock(); } catch (e) { /* 忽略 */ }
            }
        }

        function toggle() {
            console.log("[横屏] toggle，当前全屏 =", is_fullscreen(), " 当前横屏 =", is_landscape());

            if (is_fullscreen()) {
                exit();
                try { localStorage.setItem(KEY, "0"); } catch (e) { /* 忽略 */ }
            } else {
                enter();
                try { localStorage.setItem(KEY, "1"); } catch (e) { /* 忽略 */ }
            }

            setTimeout(update_label, 150);
        }

        function init() {
            btn = document.querySelector("#screen-mode-toggle");

            var inFrame = window.top !== window.self;

            console.log(
                "[横屏] init\n" +
                "  按钮找到 = " + !!btn + "\n" +
                "  requestFullscreen = " + typeof document.documentElement.requestFullscreen + "\n" +
                "  webkitRequestFullscreen = " + typeof document.documentElement.webkitRequestFullscreen + "\n" +
                "  在 iframe 内 = " + inFrame + "\n" +
                "  fullscreenEnabled = " + document.fullscreenEnabled + "\n" +
                "  orientation.lock = " + (screen.orientation ? typeof screen.orientation.lock : "无 orientation") + "\n" +
                "  屏幕 = " + window.innerWidth + "x" + window.innerHeight
            );

            if (inFrame && document.fullscreenEnabled === false) {
                console.warn(
                    "[横屏] 当前页面在 iframe 里且没有 fullscreen 权限。\n" +
                    "需要 iframe 带 allow=\"fullscreen\" 属性，或直接在浏览器里打开 index.html 测试。"
                );
            }

            if (btn) {
                btn.addEventListener("click", function (ev) {
                    console.log("[横屏] 按钮被点击");
                    ev.stopPropagation();
                    ev.preventDefault();
                    toggle();
                });

                btn.addEventListener("pointerdown", function (ev) {
                    ev.stopPropagation();
                }, true);
            } else {
                console.error("[横屏] 找不到 #screen-mode-toggle 按钮");
            }

            // 全屏状态变化时同步按钮文案
            ["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"].forEach(function (name) {
                document.addEventListener(name, function () {
                    update_label();

                    // 进入全屏后尝试锁横屏（有些浏览器允许在 change 后锁）
                    if (is_fullscreen()) lock_landscape();
                });
            });

            // 屏幕旋转时也刷新
            window.addEventListener("orientationchange", update_label);
            window.addEventListener("resize", update_label);

            update_label();

            // 上次用过全屏横屏的话，提示用户在任意点击时自动进入
            var wanted = null;

            try { wanted = localStorage.getItem(KEY); } catch (e) { /* 忽略 */ }

            if (wanted === "1") {
                var arm = function () {
                    document.removeEventListener("pointerdown", arm, true);
                    document.removeEventListener("touchstart", arm, true);

                    if (!is_fullscreen()) enter();
                };

                document.addEventListener("pointerdown", arm, true);
                document.addEventListener("touchstart", arm, true);
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    })();
    </script>

</body>
