<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Phigros 模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s;
        }
        
        #loading-progress {
            width: 80%;
            max-width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        #loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff3366, #ff9966);
            width: 0%;
            transition: width 0.3s;
        }
        
        #loading-text {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }
        
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900;
            text-align: center;
        }
        
        #start-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff3366, #ff9966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 51, 102, 0.3);
        }
        
        #start-button {
            margin-top: 40px;
            padding: 16px 32px;
            font-size: 20px;
            background: linear-gradient(45deg, #ff3366, #ff9966);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(255, 51, 102, 0.4);
        }
        
        #start-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(255, 51, 102, 0.2);
        }
        
        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }
        
        #debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
            display: none;
        }
        
        #offset-toggle {
            position: fixed;
            right: 10px;
            bottom: 10px;
            z-index: 950;
            padding: 8px 14px;
            font-family: inherit;
            font-size: 14px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
        }
        
        #offset-panel {
            position: fixed;
            right: 10px;
            bottom: 58px;
            z-index: 950;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            background: rgba(20, 20, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            
            /* 高度上限：扣掉下方「偏移」按钮(58px)和上下留白(70px)，剩下的全部可用 */
            max-height: calc(100vh - 58px - 70px);
            max-height: calc(100dvh - 58px - 70px);   /* 支持 dvh 的浏览器用更准的值 */
            
            /* 内容超出时内部滚动，不再被屏幕裁掉 */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;   /* iOS 惯性滚动 */
            overscroll-behavior: contain;        /* 滚到头不带动页面 */
            
            /* 允许竖向滑动（滚动），但不要触发双指缩放等默认手势 */
            touch-action: pan-y;
            
            /* 细滚动条（桌面端调试时能看到） */
            scrollbar-width: thin;
        }
        
        #offset-value,
        #font-value {
            padding: 2px 0;
            text-align: center;
            color: #ffcc66;
        }
        
        /* 顶部标题条：唯一可拖动区域（拖动时它不会滚动内容） */
        #offset-value {
            cursor: move;
            touch-action: none;
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 4px 0 8px;
            background: rgba(20, 20, 26, 0.98);   /* 盖住滚上来的内容 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .offset-row {
            display: flex;
            gap: 6px;
        }
        
        .offset-row button,
        #offset-reset {
            flex: 1;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 13px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        
        #offset-toggle:active,
        .offset-row button:active,
        #offset-reset:active {
            background: rgba(255, 90, 130, 0.55);
        }
        
        .offset-row button.font-active {
            background: rgba(255, 204, 102, 0.35);
            border-color: #ffcc66;
        }
        
        #export-hint {
            padding: 2px 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
        }
        
        #export-status {
            min-height: 16px;
            text-align: center;
            font-size: 12px;
            color: #8fe3a0;
        }
        
        /* 表单控件默认不继承字体，补一下让按钮跟随界面字体 */
        button {
            font-family: inherit;
        }
        
        #chart-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        
        #chart-actions button {
            padding: 10px 18px;
            font-family: inherit;
            font-size: 15px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
        }
        
        #chart-actions button:active {
            background: rgba(255, 90, 130, 0.5);
        }
        
        #chart-status {
            margin-top: 16px;
            font-size: 14px;
            color: #ffcc66;
        }
        
        #import-message {
            margin-top: 8px;
            min-height: 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .hidden {
            display: none !important;
        }

/* ===== 开场动画样式 ===== */
/* =============================================================
 * 开场动画样式 —— 追加到 index.html 的 <style> 末尾即可
 * 变量 --loading-black / -white / -logo / -grid 由 JS 每帧写入
 * ============================================================= */

/* 原加载页内容（标题/进度条/文字）保留。
   注意：默认是「可见」的，让 main.js 加载期间用户仍能看到进度条，
   只有真正开始播动画时（.phigros-opening-stage 加上 .is-playing）
   才淡出，避免出现「一开始就黑屏」的突兀感。 */
.phigros-original-loading {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 1;
  pointer-events: none;
  transition: opacity .35s ease;
  z-index: 20;
}

/* 开始播动画时，原内容退场 */
#loading-screen.phigros-opening-stage.is-playing .phigros-original-loading {
  opacity: 0;
}

/* 动画舞台：接管 #loading-screen 的显示。
   注意：这里不要设 background:#000 —— 背景由 .loading-black 层负责，
   否则加载期间会变成纯黑遮住原来的进度条。 */
#loading-screen.phigros-opening-stage {
  --loading-black: 0;
  --loading-white: 0;
  --loading-logo: 0;
  --loading-grid: 0;
  background: #000;
  overflow: hidden;
}

/* 动画层都绝对定位铺满，并脱离原 flex 布局 */
.phigros-opening-stage > .loading-black,
.phigros-opening-stage > #loading-grid,
.phigros-opening-stage > .loading-white,
.phigros-opening-stage > .loading-emblem {
  position: absolute;
  inset: 0;
}

#loading-grid {
  width: 100%;
  height: 100%;
  display: block;
  z-index: 12;
  opacity: var(--loading-grid);
  mix-blend-mode: plus-lighter;
  pointer-events: none;
}

.loading-black {
  background: #000;
  opacity: var(--loading-black);
  z-index: 10;
  pointer-events: none;
  /* 首帧淡入，避免在 .is-playing 切换瞬间「啪」地盖住原进度条 */
  transition: opacity .28s ease;
}

.loading-white {
  background: #ededed;
  opacity: var(--loading-white);
  mix-blend-mode: plus-lighter;
  z-index: 13;
  pointer-events: none;
}

.loading-emblem {
  opacity: var(--loading-logo);
  z-index: 11;
  pointer-events: none;
}

/* ---------- 中央标志 ---------- */
.loading-orbit {
  position: absolute;
  left: 50%;
  top: 44%;
  width: 120px;
  height: 120px;
  border: 2px solid #a8d4df60;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: inset 0 0 22px #66c9dc35, 0 0 24px #66c9dc20;
}
.loading-orbit::after {
  content: "";
  position: absolute;
  inset: -24px 6px;
  border: 1px solid #b4e7f0aa;
  border-radius: 50%;
  transform: rotate(62deg);
}

.loading-wordmark {
  position: absolute;
  top: 57%;
  width: 100%;
  text-align: center;
  font-size: clamp(24px, 4vw, 50px);
  letter-spacing: .4em;
  margin-left: .4em;
  color: #d6eff7;
}

.loading-caption {
  position: absolute;
  top: 68%;
  width: 100%;
  text-align: center;
  font-size: 14px;
  letter-spacing: .3em;
  margin-left: .3em;
  color: #7294a0;
}

.loading-dots {
  position: absolute;
  left: 48.828125%;
  top: 88.392857%;
  width: 2.34375%;
  display: flex;
  gap: .12vw;
  transform: translateY(-50%);
}
.loading-dots span {
  display: block;
  width: .66vw;
  height: .47vw;
  border-radius: 50%;
  background: #fff;
  filter: blur(.3px);
}

@media (max-width: 720px) {
  .loading-dots span { width: 4px; height: 4px; }
  .loading-orbit { width: 88px; height: 88px; }
}

@media (prefers-reduced-motion: reduce) {
  #loading-screen { transition: none; }
}

    </style>
</head>
<body>
    <script>
        // ===== 早期错误探针（必须是第一个脚本）=====
        // 任何脚本错误都直接显示到加载页上，避免再出现「卡住但完全没有提示」
        window.__main_loaded = false;

        const show_probe = (text) => {
            const el = document.querySelector("#loading-text");

            if (el) {
                el.style.color = "#ff5566";
                el.textContent = text;
            }

            // 加载页已隐藏时也能看到（写到开始界面的提示行），并且进控制台
            const msg = document.querySelector("#import-message");

            if (msg) {
                msg.style.color = "#ff5566";
                msg.textContent = text;
            }

            console.error("[探针] " + text);
        };

        window.addEventListener("error", e => {
            if (e.message || e.filename) {
                show_probe("脚本错误：" + (e.message || e.filename) + (e.lineno ? "（第 " + e.lineno + " 行）" : ""));
            }
        });

        window.addEventListener("unhandledrejection", e => {
            const r = e.reason;
            show_probe("未处理的错误：" + (r && r.message ? r.message : String(r)));
        });

        // main.js 若 5 秒后还没开始执行，多半是解析失败 / js 目录没部署
        setTimeout(() => {
            if (!window.__main_loaded) {
                show_probe("main.js 没有开始执行（语法错误，或文件 / js 目录没加载到）");
            }
        }, 5000);
    </script>

    <div id="loading-screen">
        <h1>Phigros 模拟器</h1>
        <div id="loading-progress">
            <div id="loading-bar"></div>
        </div>
        <div id="loading-text">正在加载资源...</div>
    </div>
    
    <div id="start-screen" class="hidden">
        <p>点击下方按钮开始游戏</p>
        <button id="start-button">开始游戏</button>
        <div id="chart-actions">
            <button id="import-button">导入谱面</button>
            <button id="clear-import-button">清理缓存</button>
        </div>
        <div id="chart-status">当前谱面：内置（res/chart）</div>
        <div id="import-message"></div>
    </div>
    
    <canvas id="main-canvas"></canvas>
    <div id="debug-info"></div>
    
    <button id="offset-toggle">偏移</button>

    <div id="offset-panel" class="hidden">
        <div id="offset-value">偏移 0 ms</div>
        <div class="offset-row">
            <button id="noise-index-toggle">噪域编号：关</button>
        </div>
        <div class="offset-row">
            <button id="autoplay-toggle">自动游玩：开</button>
        </div>
        <div class="offset-row">
            <button data-delta="-50">-50</button>
            <button data-delta="-10">-10</button>
            <button data-delta="-1">-1</button>
        </div>
        <div class="offset-row">
            <button data-delta="1">+1</button>
            <button data-delta="10">+10</button>
            <button data-delta="50">+50</button>
        </div>
        <button id="offset-reset">重置</button>
        <div id="font-value">字体：默认</div>
        <div class="offset-row">
            <button data-font="0">默认</button>
            <button data-font="1">PHIFON</button>
            <button data-font="2">濑户</button>
            <button data-font="3">汉仪粗</button>
        </div>
        <div id="export-hint">导出打击记录</div>
        <div class="offset-row">
            <button id="export-judged">已判定</button>
            <button id="export-all">全谱面</button>
        </div>
        <div id="export-status"></div>
    </div>

    <audio id="bgm" preload="auto"></audio>

    <input type="file" id="file-input" class="hidden">

    <script src="opening-original.js"></script>
    <script src="opening-bridge.js"></script>
    
    
    
    <script src="main.js"></script>
</body>
</html>
