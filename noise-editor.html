<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phi-Demo 噪域编辑器</title>
<style>
:root{color-scheme:dark;--bg:#11141b;--panel:#1b202a;--line:#343c49;--muted:#aab4c3;--accent:#ff6b78;--green:#73e0ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef2f8;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:8px;background:#29313d;padding:8px 12px;cursor:pointer}button:hover{background:#374252}button.danger{color:#ff9da5}button.primary{background:#a9364e;border-color:#d75a70}.top{position:sticky;top:0;z-index:3;background:#171b23;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top strong{font-size:17px;margin-right:auto}.top label{display:flex;gap:6px;align-items:center}.top input[type=file]{max-width:230px}.status{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:12px;padding:12px;max-width:1600px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.panel h2,.panel h3{margin:0 0 10px}.list{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}.area-item{display:flex;align-items:center;gap:8px;text-align:left;width:100%}.area-item.active{outline:2px solid var(--accent)}.area-item span:last-child{margin-left:auto;color:var(--muted);font-size:12px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px}.field input,.field select{width:100%;min-width:0;background:#111720;border:1px solid var(--line);border-radius:6px;padding:7px;color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row .field{flex:1 1 130px}.sub{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.hint{color:var(--muted);font-size:12px;line-height:1.55}.track{border:1px solid var(--line);border-radius:9px;padding:9px;margin:9px 0}.track-head{display:flex;gap:8px;align-items:center}.track-head strong{flex:1}.events{display:flex;flex-direction:column;gap:6px;margin-top:8px}.event{display:grid;grid-template-columns:repeat(4,minmax(70px,1fr)) auto;gap:5px;align-items:center}.event input{width:100%;min-width:0;background:#10151d;border:1px solid var(--line);border-radius:5px;padding:6px}.canvas-wrap{position:relative;margin:8px 0}.canvas-wrap canvas{display:block;width:100%;height:min(55vh,520px);background:#090c12;border:1px solid var(--line);border-radius:8px;touch-action:none}.sample-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sample-controls input{flex:1;min-width:180px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.empty{color:var(--muted);padding:20px;text-align:center}.hide{display:none!important}.warning{color:#ffd47c}details summary{cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:850px){.layout{grid-template-columns:1fr}.list{max-height:30vh}.event{grid-template-columns:repeat(2,minmax(80px,1fr)) auto}.event .wide{grid-column:span 2}}
</style>
</head>
<body>
<header class="top"><strong>Phi-Demo · 噪域编辑器</strong><label>载入 chart.json <input id="file" type="file" accept=".json,application/json"></label><button id="new-chart">新建空谱面</button><button id="export" class="primary" disabled>导出 chart.json</button><span id="status" class="status">请载入含 judgeLineList 的谱面 JSON。</span></header>
<main class="layout">
<section class="panel"><h2>噪域列表</h2><div class="toolbar"><button id="add" disabled>＋ 新增噪域</button><button id="remove" class="danger" disabled>删除选中</button></div><p class="hint">支持官方 chart.json 的 blockAreaList 格式。调整后导出 JSON，再从模拟器的“导入谱面”载入即可预览/游玩。</p><div id="areas" class="list"><div class="empty">尚未载入谱面</div></div></section>
<section class="panel"><div class="two"><div><h2>预览与时间</h2><div class="sample-controls"><label>谱面时间 <input id="time" type="range" min="0" max="300" step="0.01" value="0"></label><output id="time-label">0.00 秒</output></div><div class="canvas-wrap"><canvas id="preview" width="900" height="600"></canvas></div><p class="hint">预览显示当前时间下的几何位置（含移动/旋转/缩放与激活状态）。它是几何预览，不复刻模拟器的噪声 shader 外观。</p></div><div><h2>噪域属性</h2><div id="properties" class="empty">选择或新增一个噪域</div></div></div><div class="sub"><h2>变换 / 激活事件</h2><div id="tracks" class="empty">选择噪域后可编辑事件轨道。</div></div></section>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s), canvas=$('#preview'),ctx=canvas.getContext('2d');
let chart=null,selected=-1,drag=null;
const clone=value=>JSON.parse(JSON.stringify(value));
const finite=(value,fallback=0)=>Number.isFinite(Number(value))?Number(value):fallback;
const defaultArea=(start=0)=>({Name:'',bottomLeftPercentage:{x:.4,y:.4},topRightPercentage:{x:.6,y:.6},appearTime:start,enableTime:start,disableTime:start+4,disappearTime:start+4.5,isSubtract:false,moveEvents:[],rotateEvents:[],scaleEvents:[]});
function timeRange(){let max=30;for(const area of chart?.blockAreaList??[])max=Math.max(max,finite(area.disappearTime));$('#time').max=String(Math.ceil(max));}
function setStatus(text,error=false){$('#status').textContent=text;$('#status').classList.toggle('warning',error)}
function areas(){return chart?.blockAreaList??[]}
function renderList(){const host=$('#areas');host.replaceChildren();if(!chart){host.innerHTML='<div class="empty">尚未载入谱面</div>';return}if(!areas().length){host.innerHTML='<div class="empty">没有噪域，点击“新增噪域”开始。</div>';return}areas().forEach((a,i)=>{const b=document.createElement('button');b.className='area-item'+(selected===i?' active':'');b.innerHTML=`<b>${a.isSubtract?'− ':''}${i}</b><span>${escapeHtml(a.Name||'未命名噪域')}</span><span>${fmt(a.appearTime)}–${fmt(a.disappearTime)}s</span>`;b.onclick=()=>select(i);host.append(b)})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return finite(n).toFixed(2)}
function field(label,value,onchange,{type='number',step='any'}={}){const l=document.createElement('label');l.className='field';l.textContent=label;const input=document.createElement('input');input.type=type;if(type==='checkbox')input.checked=Boolean(value);else{input.step=step;input.value=value??''}input.onchange=()=>{const v=type==='checkbox'?input.checked:type==='text'?input.value:Number(input.value);if(type!=='text'&&type!=='checkbox'&&!Number.isFinite(v)){input.value=value;return}onchange(v)};l.append(input);return l}
function updateArea(mut,label='已修改'){const a=areas()[selected];if(!a)return;mut(a);renderList();draw();setStatus(label+'（导出后生效）')}
function select(i){selected=i;renderList();renderProperties();renderTracks();draw()}
function renderProperties(){const host=$('#properties');host.replaceChildren();const a=areas()[selected];if(!a){host.textContent='选择或新增一个噪域';host.className='empty';return}host.className='';const grid=document.createElement('div');grid.className='field-grid';grid.append(field('名称',a.Name??'',v=>updateArea(x=>x.Name=v),{type:'text'}),field('反向 / 相减区域',a.isSubtract,v=>updateArea(x=>x.isSubtract=v),{type:'checkbox'}),field('出现时间（秒）',a.appearTime,v=>updateArea(x=>x.appearTime=v)),field('开始激活（秒）',a.enableTime,v=>updateArea(x=>x.enableTime=v)),field('停止激活（秒）',a.disableTime,v=>updateArea(x=>x.disableTime=v)),field('消失时间（秒）',a.disappearTime,v=>updateArea(x=>x.disappearTime=v)));for(const [corner,caption] of [['bottomLeftPercentage','左下角'],['topRightPercentage','右上角']])for(const axis of ['x','y'])grid.append(field(`${caption} ${axis.toUpperCase()}（0–1）`,a[corner]?.[axis],v=>updateArea(x=>{x[corner]??={x:.5,y:.5};x[corner][axis]=v})));host.append(grid);const hint=document.createElement('p');hint.className='hint';hint.textContent='可在画布上拖动矩形中心调整位置；此操作会写入首个 moveEvents 关键帧。坐标采用官方格式的归一化屏幕百分比。';host.append(hint)}
const TRACKS=[['activeIntervals','激活区间','startTime','endTime'],['moveEvents','移动关键帧','time','time'],['rotateEvents','旋转关键帧','time','time'],['scaleEvents','缩放关键帧','time','time']];
function addTrackEvent(type){const a=areas()[selected];if(!a)return;const t=finite($('#time').value);if(type==='activeIntervals')a[type].push({startTime:t,endTime:t+1,readyFlash:.5});else if(type==='moveEvents')a[type].push({time:t,endPosition:{x:(finite(a.bottomLeftPercentage?.x,.4)+finite(a.topRightPercentage?.x,.6))/2,y:(finite(a.bottomLeftPercentage?.y,.4)+finite(a.topRightPercentage?.y,.6))/2},easeTypeX:0,easeTypeY:0});else if(type==='rotateEvents')a[type].push({time:t,rotation:0,anchor:{x:.5,y:.5},easeType:0});else a[type].push({time:t,scale:{x:1,y:1},anchor:{x:.5,y:.5},easeTypeX:0,easeTypeY:0});a[type].sort((x,y)=>finite(x.time??x.startTime)-finite(y.time??y.startTime));renderTracks();draw();setStatus('已添加事件（导出后生效）')}
function renderTracks(){const host=$('#tracks');host.replaceChildren();const a=areas()[selected];if(!a){host.textContent='选择噪域后可编辑事件轨道';host.className='empty';return}host.className='';for(const [type,title] of TRACKS){a[type]??=[];const box=document.createElement('details');box.className='track';box.open=type==='activeIntervals';const head=document.createElement('summary');head.className='track-head';head.innerHTML=`<strong>${title} · ${a[type].length}</strong>`;const add=document.createElement('button');add.type='button';add.textContent='＋ 添加';add.onclick=e=>{e.preventDefault();addTrackEvent(type)};head.append(add);box.append(head);const list=document.createElement('div');list.className='events';a[type].forEach((ev,index)=>{const row=document.createElement('div');row.className='event';const inputs=type==='activeIntervals'?['startTime','endTime','readyFlash']:type==='moveEvents'?['time','x','y','easeTypeX']:type==='rotateEvents'?['time','rotation','anchorX','anchorY']:['time','scaleX','scaleY','anchorX','anchorY'];for(const key of inputs){let value=key==='x'?ev.endPosition?.x:key==='y'?ev.endPosition?.y:key==='scaleX'?ev.scale?.x:key==='scaleY'?ev.scale?.y:key==='anchorX'?ev.anchor?.x:key==='anchorY'?ev.anchor?.y:ev[key];const input=document.createElement('input');input.type=key==='readyFlash'?'number':'number';input.step='any';input.title=key;input.setAttribute('aria-label',key);input.placeholder=key;input.value=value??'';input.onchange=()=>{const v=Number(input.value);if(!Number.isFinite(v)){renderTracks();return}if(key==='x'||key==='y'){ev.endPosition??={x:.5,y:.5};ev.endPosition[key]=v}else if(key==='scaleX'||key==='scaleY'){ev.scale??={x:1,y:1};ev.scale[key==='scaleX'?'x':'y']=v}else if(key==='anchorX'||key==='anchorY'){ev.anchor??={x:.5,y:.5};ev.anchor[key==='anchorX'?'x':'y']=v}else ev[key]=v;draw();setStatus('事件已修改（导出后生效）')};row.append(input)}if(type==='activeIntervals'){const label=document.createElement('label');label.className='wide';label.textContent='预备闪烁';const check=document.createElement('input');check.type='checkbox';check.checked=finite(ev.readyFlash,.5)>0;check.onchange=()=>{ev.readyFlash=check.checked?.5:0;draw()};label.append(check);row.append(label)}const del=document.createElement('button');del.className='danger';del.textContent='×';del.title='删除事件';del.onclick=()=>{a[type].splice(index,1);renderTracks();draw();setStatus('事件已删除（导出后生效）')};row.append(del);list.append(row)});box.append(list);host.append(box)}}
function eventValue(list,t,read){if(!Array.isArray(list)||!list.length)return null;const sorted=[...list].sort((a,b)=>finite(a.time)-finite(b.time));let prev=sorted[0];for(let i=1;i<sorted.length;i++){const next=sorted[i];if(t<next.time){const p=Math.max(0,Math.min(1,(t-prev.time)/Math.max(1e-9,next.time-prev.time)));return read(prev)+(read(next)-read(prev))*p}prev=next}return read(prev)}
function pose(a,t,aspect){const lo=a.bottomLeftPercentage??{x:.4,y:.4},hi=a.topRightPercentage??{x:.6,y:.6};let cx=((finite(lo.x,.4)+finite(hi.x,.6))/2-.5)*10*aspect,cy=(.5-(finite(lo.y,.4)+finite(hi.y,.6))/2)*10;const sx=eventValue(a.scaleEvents,t,e=>finite(e.scale?.x,1))??1,sy=eventValue(a.scaleEvents,t,e=>finite(e.scale?.y,1))??1,angle=(eventValue(a.rotateEvents,t,e=>finite(e.rotation))??0)*Math.PI/180;const move=eventValue(a.moveEvents,t,e=>e.endPosition?.x);const moveY=eventValue(a.moveEvents,t,e=>e.endPosition?.y);if(move!==null)cx+=(move-.5)*10*aspect;if(moveY!==null)cy+=(.5-moveY)*10;return{cx,cy,w:Math.abs(finite(hi.x,.6)-finite(lo.x,.4))*10*aspect*sx,h:Math.abs(finite(hi.y,.6)-finite(lo.y,.4))*10*sy,angle}}
function draw(){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#101722';ctx.fillRect(0,0,w,h);if(!chart){ctx.fillStyle='#95a1b1';ctx.textAlign='center';ctx.fillText('载入谱面 JSON 以编辑噪域',w/2,h/2);return}const t=finite($('#time').value),aspect=w/h,scale=h/10;ctx.strokeStyle='#303b49';ctx.lineWidth=1;for(let i=1;i<10;i++){ctx.beginPath();ctx.moveTo(i*w/10,0);ctx.lineTo(i*w/10,h);ctx.stroke()}for(let i=1;i<10;i++){ctx.beginPath();ctx.moveTo(0,i*h/10);ctx.lineTo(w,i*h/10);ctx.stroke()}areas().forEach((a,i)=>{if(t<finite(a.appearTime)||t>=finite(a.disappearTime))return;const p=pose(a,t,aspect),cx=w/2+p.cx*scale,cy=h/2-p.cy*scale;ctx.save();ctx.translate(cx,cy);ctx.rotate(-p.angle);const active=(a.activeIntervals??[]).some(e=>t>=finite(e.startTime)&&t<finite(e.endTime));ctx.fillStyle=a.isSubtract?'rgba(181,130,220,.25)':active?'rgba(255,73,82,.48)':'rgba(185,87,91,.22)';ctx.strokeStyle=i===selected?'#ffe08a':a.isSubtract?'#d4adff':'#ff858b';ctx.lineWidth=i===selected?4:2;ctx.fillRect(-p.w*scale/2,-p.h*scale/2,p.w*scale,p.h*scale);ctx.strokeRect(-p.w*scale/2,-p.h*scale/2,p.w*scale,p.h*scale);ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText(`${a.isSubtract?'−':''}${i} ${a.Name||'噪域'}`,0,5);if(i===selected&&drag){ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill()}ctx.restore()})}
function select(i){selected=i;renderList();renderProperties();renderTracks();draw()}
$('#file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.judgeLineList))throw Error('缺少 judgeLineList，文件不是可识别的谱面 JSON');chart=parsed;chart.blockAreaList=Array.isArray(parsed.blockAreaList)?parsed.blockAreaList:[];selected=-1;timeRange();$('#add').disabled=false;$('#export').disabled=false;$('#remove').disabled=true;renderList();renderProperties();renderTracks();draw();setStatus(`${file.name} · ${areas().length} 个噪域已载入`)}catch(err){setStatus('载入失败：'+err.message,true)}e.target.value=''};
$('#new-chart').onclick=()=>{chart={formatVersion:3,offset:0,judgeLineList:[],blockAreaList:[]};selected=-1;timeRange();$('#add').disabled=false;$('#export').disabled=false;renderList();renderProperties();renderTracks();draw();setStatus('已创建空谱面；请注意模拟器需要谱面、音乐和曲绘')};
$('#add').onclick=()=>{if(!chart)return;const t=finite($('#time').value);areas().push(defaultArea(t));timeRange();$('#remove').disabled=false;select(areas().length-1);setStatus('已新增噪域')};
$('#remove').onclick=()=>{if(selected<0)return;areas().splice(selected,1);selected=-1;$('#remove').disabled=true;timeRange();select(-1);setStatus('噪域已删除（导出后生效）')};
$('#time').oninput=()=>{$('#time-label').value=fmt($('#time').value)+' 秒';draw()};
$('#export').onclick=()=>{if(!chart)return;const blob=new Blob([JSON.stringify(chart,null,2)+'\n'],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=(chart.name||chart.META?.name||'chart')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);setStatus('已导出 JSON；在模拟器中导入该文件即可查看完整噪域效果')};
canvas.onpointerdown=e=>{if(selected<0)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height,p=pose(areas()[selected],finite($('#time').value),canvas.width/canvas.height),cx=canvas.width/2+p.cx*canvas.height/10,cy=canvas.height/2-p.cy*canvas.height/10;if(Math.abs(x-cx)>p.w*canvas.height/20||Math.abs(y-cy)>p.h*canvas.height/20)return;drag={x,y,area:clone(areas()[selected])};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height,dx=(x-drag.x)/(canvas.height/10),dy=-(y-drag.y)/(canvas.height/10),a=areas()[selected],t=finite($('#time').value);a.moveEvents??=[];let ev=a.moveEvents.find(entry=>Math.abs(finite(entry.time)-t)<.02);if(!ev){ev={time:t,endPosition:{x:.5,y:.5},easeTypeX:0,easeTypeY:0};a.moveEvents.push(ev)}const start=drag.area.moveEvents?.find(entry=>Math.abs(finite(entry.time)-t)<.02);const base=start?.endPosition??{x:(finite(drag.area.bottomLeftPercentage?.x,.4)+finite(drag.area.topRightPercentage?.x,.6))/2,y:(finite(drag.area.bottomLeftPercentage?.y,.4)+finite(drag.area.topRightPercentage?.y,.6))/2};ev.endPosition={x:Math.max(-2,Math.min(3,base.x+dx/(10*(canvas.width/canvas.height)))),y:Math.max(-2,Math.min(3,base.y-dy/10))};renderTracks();draw();setStatus('位置已更新；导出后生效')};canvas.onpointerup=canvas.onpointercancel=()=>{if(drag){drag=null;renderList();draw()}};
$('#remove').disabled=true;$('#add').disabled=true;$('#export').disabled=true;draw();
</script>
</body>
</html>
